<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDI Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="tools/auth.js"></script>
<style>
:root {
  --blue: #1f3f94;
  --blue-dark: #17306f;
  --orange: #1f3f94;
  --red: #e2501f;
  --foot-h: 46px;
  --active: #dfe7f7;
  --bg: #ffffff;
  --text: #2b2b2b;
  --muted: #6b7680;
  --line: #d9dee3;
  --side-w: 258px;
  --top-h: 64px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: "Sarabun", Tahoma, sans-serif; font-size: 15px; color: var(--text); background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; }

/* แถบบน */
.topbar { height: var(--top-h); background: #fff; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 0 0 18px; border-bottom: 1px solid var(--line); }
.burger { background: none; border: 0; padding: 8px; cursor: pointer; border-radius: 6px; display: grid; place-items: center; }
.burger:hover { background: #eef1f8; }
.burger svg { width: 22px; height: 22px; stroke: var(--blue-dark); }
.brand { display: flex; align-items: center; gap: 8px; line-height: 1; user-select: none; }
.brand svg { width: 46px; height: 46px; flex: none; }
.brand .name { display: grid; gap: 4px; }
.brand .name b { color: var(--blue); font-size: 22px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
.brand .name small { color: #222; font-size: 12px; letter-spacing: 3px; white-space: nowrap; }
.top-right { margin-left: auto; align-self: stretch; display: flex; align-items: center; gap: 14px; background: var(--blue); padding: 0 26px; }
.pill { color: #fff; padding: 6px 0; font-weight: 600; font-size: 13px; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; border-left: 1px solid rgba(255,255,255,.35); padding-left: 14px; }
.who[hidden] { display: none; }
.who button { background: none; border: 1px solid #fff; color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.who button:hover { background: rgba(255,255,255,.15); }

/* หน้าเข้าสู่ระบบ */
.login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: #f4f6fa; }
.login[hidden] { display: none; }
.login form { width: 100%; max-width: 360px; background: #fff; border: 1.5px solid var(--blue); border-radius: 18px; padding: 28px 26px 24px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
.login .brand { justify-content: center; margin-bottom: 18px; }
.login h2 { margin: 0 0 14px; text-align: center; font-size: 18px; color: var(--blue-dark); }
.login label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
.login input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid #9aa3ad; border-radius: 6px; }
.login input:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
.login button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
.login button:hover { background: var(--blue-dark); }
.login .err { margin: 12px 0 0; color: #c0261b; font-size: 14px; text-align: center; min-height: 1.3em; }
.login .note { margin: 14px 0 0; color: var(--muted); font-size: 12.5px; text-align: center; }

/* โครงหน้า */
.layout { display: flex; height: calc(100% - var(--top-h) - var(--foot-h)); }
.foot { height: var(--foot-h); background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 12px; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side { width: var(--side-w); flex: none; border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 8px 24px; transition: margin-left .2s; background: #fff; }
body.side-closed .side { margin-left: calc(var(--side-w) * -1); }

.search { display: flex; align-items: center; border: 1px solid #555; border-radius: 999px; padding: 4px 10px 4px 14px; margin: 0 8px 22px; }
.search input { border: 0; outline: 0; flex: 1; min-width: 0; font: inherit; font-size: 14px; background: none; }
.search button { background: none; border: 0; padding: 2px 4px; cursor: pointer; display: grid; place-items: center; }
.search svg { width: 18px; height: 18px; stroke: #111; stroke-width: 2.4; }

.group-head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 6px 12px; font-size: 16px; font-weight: 700; color: var(--blue-dark); cursor: pointer; }
.group-head svg { width: 14px; height: 14px; stroke: var(--blue-dark); stroke-width: 3; transition: transform .15s; }
.group.closed .group-head svg { transform: rotate(180deg); }
.group.closed .items { display: none; }
.items { margin: 10px 0 18px; display: grid; gap: 2px; }
.item { display: flex; align-items: center; gap: 14px; padding: 7px 12px; border-radius: 999px; text-decoration: none; color: var(--red); font-size: 14px; font-weight: 700; }
.item:hover { background: #eef2fb; }
.item.active { background: var(--active); }
.item svg { width: 19px; height: 19px; flex: none; stroke: var(--orange); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.item.active svg { stroke: var(--blue-dark); }
.item[hidden] { display: none; }
.none { padding: 6px 14px; color: var(--muted); font-size: 14px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 28px 22px 34px; }
.crumb { margin: 0 0 22px; font-size: 24px; font-weight: 400; color: #333; }
.crumb small { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.crumb .guide { display: inline-flex; align-items: center; gap: 6px; margin-left: 14px; vertical-align: middle; font-size: 14px; font-weight: 600; color: var(--blue); text-decoration: none; border: 1px solid var(--blue); border-radius: 999px; padding: 3px 12px; }
.crumb .guide:hover { background: #eef2fb; }
.card { flex: 1; min-height: 0; border: 1.5px solid var(--blue); border-radius: 18px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.12); background: #fff; }
.card iframe { width: 100%; height: 100%; border: 0; display: block; }
.card iframe[hidden] { display: none; }

@media (max-width: 760px) {
  .side { position: fixed; top: var(--top-h); bottom: var(--foot-h); left: 0; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,.18); }
  .main { padding: 16px; }
  .crumb { font-size: 20px; margin-bottom: 14px; }
  .top-right, .brand .name small { display: none; }
  :root { --foot-h: 58px; }
  .foot { font-size: 13.5px; white-space: normal; line-height: 1.3; }
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" aria-label="Open / close menu">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand" aria-label="Heung A Line">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <g id="halLogo">
      <defs><clipPath id="lc"><circle cx="24" cy="24" r="22"/></clipPath></defs>
      <circle cx="24" cy="24" r="22" fill="#e2501f"/>
      <g clip-path="url(#lc)">
        <rect x="0" y="29" width="48" height="20" fill="#fff"/>
        <rect x="0" y="31" width="48" height="3.2" fill="#1f3f94"/>
        <rect x="0" y="36.4" width="48" height="3.2" fill="#1f3f94"/>
        <rect x="0" y="41.8" width="48" height="3.2" fill="#1f3f94"/>
      </g>
      <circle cx="24" cy="24" r="22" fill="none" stroke="#1f3f94" stroke-width="1.5"/>
      <text x="24" y="24.5" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#f6c443">HAL</text>
      </g>
    </svg>
    <div class="name"><b>HEUNG A LINE</b><small>興亞 LINE 株式會社</small></div>
  </div>
  <div class="top-right">
    <span class="pill">Processed in your browser · No files are uploaded</span>
    <span class="who" id="who" hidden><span id="whoName"></span><button id="signOut" type="button">Sign out</button></span>
  </div>
</header>

<div class="layout">
  <nav class="side" id="side">
    <div class="search">
      <input id="q" type="text" placeholder="Search tools" autocomplete="off">
      <button id="qClear" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="menu"></div>
    <div class="none" id="none" hidden>No results</div>
  </nav>

  <main class="main">
    <h1 class="crumb" id="crumb"></h1>
    <div class="card" id="card"></div>
  </main>
</div>

<footer class="foot">EDI Verification Project by Ms. Rattana Mudlae&nbsp;&nbsp;Position Import DOC (Generated Date :2026-08-03)</footer>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#halLogo"/></svg><div class="name"><b>HEUNG A LINE</b><small>EDI Tools</small></div></div>
    <h2>Sign in</h2>
    <label for="uid">User ID</label>
    <input id="uid" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
    <label for="pwd">Password</label>
    <input id="pwd" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="note" id="loginNote" hidden>Preview: the site is not locked yet</p>
  </form>
</div>

<script>
const ICON = {
  check: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/>',
  clock: '<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M9 3h6"/>',
  swap:  '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  temp:  '<path d="M10 14V5a2 2 0 014 0v9a4 4 0 11-4 0z"/><path d="M12 10v6"/>',
  sum:   '<path d="M4 20h16M7 16V9M12 16V5M17 16v-4"/>',
  doc:   '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'
};
const GROUPS = [
  { name: "Document checks", tools: [
    { id: "check-cntrs", title: "Check CNTRS", desc: "Compare MANIFEST with CNTRS: SHED · STATUS · TEMP · VENT · DG · REMARK", src: "tools/check-cntrs.html", guide: "tools/guide-check-cntrs-en.html", icon: "check" },
    { id: "check-dem",   title: "Check DEM",   desc: "Find the DEM start date and the REC. date from Freedays + ATA", src: "tools/check-dem.html", guide: "tools/guide-check-dem-en.html", icon: "clock" }
  ]},
  { name: "EDI file editing", tools: [
    { id: "change-status", title: "Change Status", desc: "MMAN × STATUS → MMAN_EDI.txt · can cut a B/L range (start–end)", src: "tools/change-status.html", guide: "tools/guide-change-status-en.html", icon: "swap" },
    { id: "temp",          title: "Revised Temp",       desc: "Fix reefer temperatures in a CLIST file (.txt)", src: "tools/temp.html", guide: "tools/guide-temp-en.html", icon: "temp" }
  ]},
  { name: "Manifest summary", tools: [
    { id: "sum-edi", title: "SUM-EDI", desc: "Split the vessel MF into LCH · LKB · MYANMAR · LAOS · MALAYSIA → SUM-EDI.pdf + SUMMARY.pdf", src: "tools/sum-edi.html", icon: "sum" }
  ]},
  { name: "Delivery Order (D/O)", tools: [
    { id: "do", title: "DO", desc: "Add DEM / power charge start dates and SPECIAL CONTAINER to the D/O (.pdf)", src: "tools/do.html", guide: "tools/guide-do-en.html", icon: "doc" }
  ]}
];
const TOOLS = GROUPS.flatMap(g => g.tools.map(t => ({ ...t, group: g.name })));
const $ = id => document.getElementById(id);

$("menu").innerHTML = GROUPS.map(g => `
  <div class="group">
    <button class="group-head">${g.name}<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    <div class="items">${g.tools.map(t =>
      `<a class="item" href="#${t.id}" data-id="${t.id}"><svg viewBox="0 0 24 24">${ICON[t.icon]}</svg>${t.title}</a>`).join("")}
    </div>
  </div>`).join("");

document.querySelectorAll(".group-head").forEach(b =>
  b.addEventListener("click", () => b.parentElement.classList.toggle("closed")));

// เปิดเครื่องมือตาม hash; iframe ถูกสร้างครั้งเดียวแล้วซ่อน/แสดง เพื่อให้งานที่ทำค้างไว้ไม่หาย
function show() {
  const t = TOOLS.find(t => t.id === location.hash.slice(1)) || TOOLS[0];
  $("crumb").innerHTML = `${t.group} › ${t.title}${t.guide ? `<a class="guide" href="${t.guide}" target="_blank" rel="noopener">Guide</a>` : ""}<small>${t.desc}</small>`;
  document.title = t.title + " · EDI Tools";
  document.querySelectorAll(".item").forEach(a => a.classList.toggle("active", a.dataset.id === t.id));
  let frame = document.querySelector(`iframe[data-id="${t.id}"]`);
  if (!frame) {
    frame = document.createElement("iframe");
    frame.dataset.id = t.id;
    frame.title = t.title;
    frame.src = t.src;
    $("card").appendChild(frame);
  }
  document.querySelectorAll("#card iframe").forEach(f => f.hidden = f !== frame);
  if (matchMedia("(max-width: 760px)").matches) document.body.classList.add("side-closed");
}
addEventListener("hashchange", () => { if ($("login").hidden) show(); });

$("burger").addEventListener("click", () => document.body.classList.toggle("side-closed"));

function filter() {
  const q = $("q").value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll(".item").forEach(a => {
    const t = TOOLS.find(t => t.id === a.dataset.id);
    const hit = !q || (t.title + " " + t.desc).toLowerCase().includes(q);
    a.hidden = !hit;
    if (hit) n++;
  });
  document.querySelectorAll(".group").forEach(g => {
    g.hidden = !g.querySelector(".item:not([hidden])");
    if (q) g.classList.remove("closed");
  });
  $("none").hidden = n > 0;
}
$("q").addEventListener("input", filter);
$("qClear").addEventListener("click", () => { $("q").value = ""; filter(); $("q").focus(); });

if (matchMedia("(max-width: 760px)").matches) document.body.classList.add("side-closed");

// ---- เข้าสู่ระบบ (ตั้งค่าใน tools/auth.js) ----
// ล็อคอยู่: ต้องเข้าสู่ระบบก่อน · ยังไม่ล็อค: เปิด ?login เพื่อทดสอบหน้าเข้าสู่ระบบ
// เครื่องมือ (iframe) โหลดหลังเข้าสู่ระบบแล้วเท่านั้น
function signedIn(id) {
  $("login").hidden = true;
  show();
  $("whoName").textContent = id;
  $("who").hidden = false;
}
const preview = new URLSearchParams(location.search).has("login");
if (HAL_AUTH.user()) signedIn(HAL_AUTH.user());
else if (HAL_AUTH.locked || preview) {
  $("login").hidden = false;
  $("loginNote").hidden = HAL_AUTH.locked;
  $("uid").focus();
} else show();
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  if (await HAL_AUTH.signIn($("uid").value, $("pwd").value)) {
    $("pwd").value = "";
    signedIn(HAL_AUTH.user());
  } else {
    $("loginErr").textContent = "Incorrect User ID or Password";
    $("pwd").select();
  }
});
$("signOut").addEventListener("click", () => {
  HAL_AUTH.signOut();
  location.reload();
});
</script>
</body>
</html>
