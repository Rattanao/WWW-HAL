# Auto-sync: copies every tool from its source repo (build/sync.js) and publishes the site.
# Runs every 30 minutes, and on demand from the Actions tab (Run workflow).
name: Sync tools

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy tools from their repos and translate
        run: node build/sync.js

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A tools
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-sync tools from their repos"
          git push
          # pushes made by this workflow do not always start a Pages build, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
